<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لا يوجد اتصال بالإنترنت - مرسل</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 40px 24px 30px;
            text-align: center;
        }

        /* حاوية المحتوى الرئيسي */
        .content-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
            max-width: 360px;
        }

        /* حاوية الشعار مع مؤشر انقطاع الاتصال */
        .logo-wrapper {
            position: relative;
            margin-bottom: 28px;
        }

        .app-logo {
            width: 110px;
            height: 110px;
            object-fit: contain;
            filter: drop-shadow(0 12px 20px rgba(0, 0, 0, 0.08));
        }

        /* أيقونة الواي فاي المقطوع فوق الشعار */
        .status-badge {
            position: absolute;
            bottom: -6px;
            left: -6px;
            width: 40px;
            height: 40px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
            border: 2px solid #fff;
        }

        .status-badge svg {
            width: 22px;
            height: 22px;
            stroke: #f97316;
            animation: pulse-icon 2s infinite ease-in-out;
        }

        @keyframes pulse-icon {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.9); opacity: 0.7; }
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 800;
            margin-bottom: 10px;
            color: #0f172a;
        }

        p {
            font-size: 0.92rem;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 24px;
            padding: 0 10px;
        }

        /* بطاقة إرشادية خفيفة */
        .status-card {
            background: #ffffff;
            border: 1px solid #f1f5f9;
            border-radius: 16px;
            padding: 14px 18px;
            width: 100%;
            margin-bottom: 28px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: right;
        }

        .status-card-icon {
            width: 36px;
            height: 36px;
            background: #fff7ed;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .status-card-icon svg {
            width: 20px;
            height: 20px;
            stroke: #f97316;
        }

        .status-card-text {
            font-size: 0.82rem;
            color: #475569;
            font-weight: 500;
        }

        /* زر إعادة المحاولة وتأثيرات التحميل */
        .btn-container {
            width: 100%;
            max-width: 360px;
        }

        .retry-btn {
            background-color: #f97316;
            color: #ffffff;
            border: none;
            height: 52px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(249, 115, 22, 0.3);
            transition: all 0.2s ease;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .retry-btn:active {
            transform: scale(0.98);
            box-shadow: 0 4px 10px rgba(249, 115, 22, 0.25);
        }

        .retry-btn:disabled {
            background-color: #fdba74;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* تصميم الـ Spinner */
        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .app-footer {
            font-size: 0.78rem;
            color: #94a3b8;
            margin-top: 18px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="content-wrap">
        <!-- الشعار مع إشارة الانقطاع -->
        <div class="logo-wrapper">
            <img src="/assets/image/icon-192.png" alt="مرسل" class="app-logo">
            <div class="status-badge">
                <svg fill="none" viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                    <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                    <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                    <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
                    <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                    <line x1="12" y1="20" x2="12.01" y2="20"></line>
                </svg>
            </div>
        </div>

        <h1>انقطع الاتصال بالإنترنت</h1>
        <p>لا يمكن الوصول للخدمة حالياً. يرجى التأكد من تشغيل بيانات الهاتف أو شبكة Wi-Fi والمحاولة مجدداً.</p>

        <!-- صندوق معلومة سريع -->
        <div class="status-card">
            <div class="status-card-icon">
                <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="16" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                </svg>
            </div>
            <div class="status-card-text">
                سيقوم التطبيق بإعادة فتح صفحتك السابقة تلقائياً فور عودة الشبكة.
            </div>
        </div>
    </div>

    <!-- زر إعادة المحاولة مع التفاعل -->
    <div class="btn-container">
        <button id="retryButton" class="retry-btn" onclick="handleRetry()">
            <div class="spinner" id="btnSpinner"></div>
            <span id="btnText">إعادة المحاولة</span>
        </button>
        <div class="app-footer">تطبيق مرسل لإدارة الشحنات والرحلات</div>
    </div>

    <script>
        function handleRetry() {
            const btn = document.getElementById('retryButton');
            const spinner = document.getElementById('btnSpinner');
            const text = document.getElementById('btnText');

            // تفعيل حالة التحميل وتعطيل الضغط المتكرر
            btn.disabled = true;
            spinner.style.display = 'inline-block';
            text.textContent = 'جاري التحقق...';

            // محاولة التحقق السريع من الاتصال بالسيرفر
            fetch('/manifest.json', { method: 'HEAD', cache: 'no-store' })
                .then(response => {
                    if (response.ok) {
                        text.textContent = 'تم الاتصال! جاري الفتح...';
                        window.location.reload();
                    } else {
                        throw new Error('No internet');
                    }
                })
                .catch(() => {
                    setTimeout(() => {
                        btn.disabled = false;
                        spinner.style.display = 'none';
                        text.textContent = 'إعادة المحاولة';
                    }, 1200);
                });
        }

        // إعادة تحميل الصفحة فوراً وبشكل تلقائي بمجرد عودة الاتصال
        window.addEventListener('online', () => {
            handleRetry();
        });
    </script>

</body>
</html>
